[platformio]
default_envs = cyd

; ------------------------------------------------------------------------------
; Shared ESP32-035 (3.5" 480x320 ST7796) Hardware Configuration
; ------------------------------------------------------------------------------
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; no upload_port / monitor_port: PlatformIO finds the board on any computer.
; Pick one yourself with  pio run -e <env> -t upload --upload-port <port>

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_flags =
    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

; ------------------------------------------------------------------------------
; Default Firmware: Physical Board Diagnostics & Pinout Verification Test
; ------------------------------------------------------------------------------
[env:cyd]
build_src_filter = +<main.cpp>

; ------------------------------------------------------------------------------
; Example 1: Super Mario Bros Autonomous Arcade Runner
; ------------------------------------------------------------------------------
[env:mario_arcade]
build_src_filter = +<../examples/mario-arcade/src/main.cpp>
build_unflags = -D SPI_FREQUENCY=40000000
build_flags =
    ${env.build_flags}
    -D SPI_FREQUENCY=80000000
    -I examples/mario-arcade/include

; ------------------------------------------------------------------------------
; Example 2: Manga Ultra Instinct & Dynamic Speedlines
; ------------------------------------------------------------------------------
[env:manga_aura]
build_src_filter = +<../examples/manga-aura/src/main.cpp>

; ------------------------------------------------------------------------------
; Example 3: Neo-Tokyo 2088 Synthwave Horizon (3D Perspective Grid)
; ------------------------------------------------------------------------------
[env:neo_tokyo_synthwave]
build_src_filter = +<../examples/neo-tokyo-synthwave/src/main.cpp>

; ------------------------------------------------------------------------------
; Example 4: Rasengan Ki Energy Vortex (3D Particle Physics)
; ------------------------------------------------------------------------------
[env:rasengan_vortex]
build_src_filter = +<../examples/rasengan-vortex/src/main.cpp>

; ------------------------------------------------------------------------------
; Example 5: Digital Katakana Matrix Rain (Cyberpunk Code Stream)
; ------------------------------------------------------------------------------
[env:matrix_rain]
build_src_filter = +<../examples/matrix-rain/src/main.cpp>

; ------------------------------------------------------------------------------
; Example 6: NOC IT Infrastructure Monitor & System Telemetry
; ------------------------------------------------------------------------------
[env:noc_dashboard]
build_src_filter = +<../examples/noc-dashboard/src/main.cpp>
build_flags =
    ${env.build_flags}
    -I examples/noc-dashboard/include

; ------------------------------------------------------------------------------
; Example 7: POKeMON Kalos Tribute (self-playing display + 1-tap / 2-tap game)
; ------------------------------------------------------------------------------
[env:pokemon_kalos]
build_src_filter = +<../examples/pokemon-kalos/src/main.cpp>
build_unflags = -D SPI_FREQUENCY=40000000
build_flags =
    ${env.build_flags}
    -D SPI_FREQUENCY=80000000
    -I examples/pokemon-kalos/include

; ------------------------------------------------------------------------------
; Example 8: Video Clip Player (JPEG frames + 8-bit DAC audio from a flash partition)
; ------------------------------------------------------------------------------
[env:video_clip]
build_src_filter = +<../examples/video-clip/src/main.cpp>
board_build.partitions = examples/video-clip/partitions.csv
build_unflags = -D SPI_FREQUENCY=40000000
build_flags =
    ${env.build_flags}
    -D SPI_FREQUENCY=80000000
    -I examples/video-clip/include
lib_deps =
    ${env.lib_deps}
    bitbank2/JPEGDEC @ ^1.8.4

; ------------------------------------------------------------------------------
; Example 9: Cloud-game thin client (game runs on a Sipeed NanoKVM, streamed over Wi-Fi)
; ------------------------------------------------------------------------------
[env:cloud_game]
build_src_filter = +<../examples/cloud-game/src/main.cpp>
build_unflags = -D SPI_FREQUENCY=40000000
build_flags =
    ${env.build_flags}
    -D SPI_FREQUENCY=80000000
    -I examples/cloud-game/include

; ------------------------------------------------------------------------------
; Example 10: Screen mirror (a computer streams its screen as changed-area JPEGs, over USB or Wi-Fi)
; ------------------------------------------------------------------------------
[env:screen_mirror]
build_src_filter = +<../examples/screen-mirror/src/main.cpp>
monitor_speed = 2000000
build_unflags = -D SPI_FREQUENCY=40000000
build_flags =
    ${env.build_flags}
    -D SPI_FREQUENCY=80000000
    -I examples/screen-mirror/include
lib_deps =
    ${env.lib_deps}
    bitbank2/JPEGDEC @ ^1.8.4

; Same firmware for the web installer (web/): USB only, never reads a local config.h
[env:screen_mirror_web]
extends = env:screen_mirror
build_flags =
    ${env:screen_mirror.build_flags}
    -D MIRROR_NO_CONFIG

; ------------------------------------------------------------------------------
; Screen mirror on other CYD boards. Same display bus (HSPI 13/12/14, CS 15, DC 2) on all of
; them; only the driver chip, colour settings, size and backlight pin change. See BOARDS.md.
; ------------------------------------------------------------------------------
; 2.8" ESP32-2432S028R, original (one micro-USB socket): ILI9341, backlight 21
[env:screen_mirror_28]
extends = env:screen_mirror
build_unflags =
    -D SPI_FREQUENCY=40000000
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_BL=27
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D SPI_FREQUENCY=55000000
    -I examples/screen-mirror/include

; 2.8" ESP32-2432S028R, newer (micro-USB + USB-C): ST7789 panel, colours need BGR order
[env:screen_mirror_28_2usb]
extends = env:screen_mirror_28
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D SPI_FREQUENCY=55000000
    -I examples/screen-mirror/include

; 2.4" ESP32-2432S024R: ILI9341, backlight 27, touch shares the display bus (like the 3.5")
[env:screen_mirror_24]
extends = env:screen_mirror_28
build_unflags =
    -D SPI_FREQUENCY=40000000
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
build_flags =
    ${env.build_flags}
    -D ILI9341_2_DRIVER=1
    -D TFT_INVERSION_OFF
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=55000000
    -I examples/screen-mirror/include

; web installer builds of the above (never read a local config.h)
[env:screen_mirror_28_web]
extends = env:screen_mirror_28
build_flags = ${env:screen_mirror_28.build_flags} -D MIRROR_NO_CONFIG

[env:screen_mirror_28_2usb_web]
extends = env:screen_mirror_28_2usb
build_flags = ${env:screen_mirror_28_2usb.build_flags} -D MIRROR_NO_CONFIG

[env:screen_mirror_24_web]
extends = env:screen_mirror_24
build_flags = ${env:screen_mirror_24.build_flags} -D MIRROR_NO_CONFIG

; 2.8" ESP32-2432S028R v3 (box says "7789"): ST7789 in RGB order, backlight 21
[env:screen_mirror_28_st7789]
extends = env:screen_mirror_28
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_OFF
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D SPI_FREQUENCY=55000000
    -I examples/screen-mirror/include

; 2.8" Guition JC2432W328 (CYD look-alike): ST7789, RGB order, backlight 27
[env:screen_mirror_jc2432w328]
extends = env:screen_mirror_24
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_OFF
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=55000000
    -I examples/screen-mirror/include

; 3.2" ESP32-2432S032 (R or C): ST7789 IPS panel (needs inversion), backlight 27
[env:screen_mirror_32]
extends = env:screen_mirror_24
build_flags =
    ${env.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_INVERSION_ON
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D SPI_FREQUENCY=55000000
    -I examples/screen-mirror/include

[env:screen_mirror_28_st7789_web]
extends = env:screen_mirror_28_st7789
build_flags = ${env:screen_mirror_28_st7789.build_flags} -D MIRROR_NO_CONFIG

[env:screen_mirror_jc2432w328_web]
extends = env:screen_mirror_jc2432w328
build_flags = ${env:screen_mirror_jc2432w328.build_flags} -D MIRROR_NO_CONFIG

[env:screen_mirror_32_web]
extends = env:screen_mirror_32
build_flags = ${env:screen_mirror_32.build_flags} -D MIRROR_NO_CONFIG
